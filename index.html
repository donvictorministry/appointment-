<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Appointment Chat</title>
<meta name="theme-color" content="#1877F2" />

   <meta name="description" content="Private appointment-only chat with Rev. Don Victor, PhD, offering secure personal communication focused on human, spiritual, and societal advancement. Access is individually granted by PIN. No public sign-up.">
    <meta name="keywords" content="Kingdom productivity, ministry tools, spiritual, Christian app, Rev Don Victor">
    <meta name="author" content="Rev. Don Victor, PhD">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="Private appointment-only chat with Rev. Don Victor, PhD, offering secure personal communication focused on human, spiritual, and societal advancement. Access is individually granted by PIN. No public sign-up">

    <meta name="theme-color" content="#1877F2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Appointment">

<!-- Minimal Open Graph tags for Facebook & WhatsApp -->
<meta property="og:title" content="Appointment Chat" />
<meta property="og:description" content="Private appointment-only chat with Rev. Don Victor, PhD, offering secure personal communication focused on human, spiritual, and societal advancement. Access is individually granted by PIN. No public sign-up." />
<meta property="og:image" content="https://i.ibb.co/F1TbCvn/file-00000000f6108210a1ae8043e7452fef.png" />
<meta property="og:url" content="https://appointment.donvictorministry.org.ng/" />
<meta property="og:type" content="website" />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="https://i.ibb.co/F1TbCvn/file-00000000f6108210a1ae8043e7452fef.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============================= LOCKED GATE (unchanged) ============================= -->
<div id="dvGate" class="dv-gate">
  <div class="dv-gate-card">
    <div id="dvGateDefault">
      <div id="dvGateLockIcon" class="dv-gate-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>
      <h1 class="dv-gate-title">Enter Appointment PIN</h1>
      <div class="dv-pin-group">
        <input id="dvPinPart1" class="dv-pin-input" type="text" inputmode="numeric" maxlength="4" placeholder="0000" />
        <input id="dvPinPart2" class="dv-pin-input" type="text" inputmode="numeric" maxlength="4" placeholder="0000" />
        <input id="dvPinPart3" class="dv-pin-input" type="text" inputmode="numeric" maxlength="4" placeholder="0000" />
      </div>
      <p id="dvGateMessage" class="dv-gate-message"></p>
      <button id="dvBtnEnter" type="button" class="dv-btn dv-gate-btn-primary">Enter</button>
    </div>

    <div id="dvGateLocked" class="dv-ticker-wrap dv-hidden">
      <div class="dv-ticker-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path><line x1="12" y1="15" x2="12" y2="17"></line></svg></div>
      <div id="dvTickerText" class="dv-ticker-text">Not accepting new PINs right now.</div>
      <div id="dvTickerReopens" class="dv-ticker-reopens"></div>
    </div>

    <div class="dv-gate-links">
      <button type="button" class="dv-gate-link-btn" data-page="schedule">
        <span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span>
        Schedule
      </button>
      <button type="button" class="dv-gate-link-btn" data-page="about">
        <span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg></span>
        About
      </button>
      <button type="button" class="dv-gate-link-btn" data-page="terms">
        <span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg></span>
        Terms
      </button>
    </div>

    <!-- Hidden Man of God door: tap the first PIN box 4x. Invisible unless triggered. -->
    <div id="dvMogReveal" class="dv-mog-reveal dv-hidden">
      <div class="dv-mog-reveal-title">Man of God Sign-in</div>
      <div id="dvMogStepRequest">
        <button id="dvBtnRequestCode" type="button" class="dv-btn dv-gate-btn-text">Send me a code</button>
      </div>
      <div id="dvMogStepVerify" class="dv-hidden">
        <input id="dvMogCodeInput" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit code" />
        <button id="dvBtnVerifyCode" type="button" class="dv-btn dv-gate-btn-primary">Verify</button>
      </div>
    </div>
  </div>
</div>

<!-- ============================= UNLOCKED SHELL ============================= -->
<div id="dvShell" class="dv-shell dv-hidden">
  <header class="dv-header1">
    <button id="dvBtnLeftSidebar" type="button" class="dv-header-btn" aria-label="Menu">
      <span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></span>
    </button>
    <div class="dv-brand">Appointment Chat</div>
    <button id="dvBtnRightSidebar" type="button" class="dv-header-btn" aria-label="Settings">
      <span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="12" cy="19" r="1.5"></circle></svg></span>
    </button>
  </header>

  <div id="dvHeader2" class="dv-header2">
    <div class="dv-search-bar">
      <span class="dv-icon" style="width:18px;height:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
      <input id="dvSearchInput" type="text" placeholder="Search" />
    </div>
  </div>

  <main id="dvTabBody" class="dv-tab-body"></main>

  <nav class="dv-bottom-nav">
    <button class="dv-nav-btn active" data-tab="home"><span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span><span>Home</span></button>
    <button class="dv-nav-btn" data-tab="chat"><span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></span><span>Chat</span><span id="dvChatBadge" class="dv-nav-badge dv-hidden">1</span></button>
    <button class="dv-nav-btn" data-tab="mog"><span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6 6 1-4.5 4.5L17 20l-5-3-5 3 1.5-6.5L4 9l6-1z"></path></svg></span><span>MOG</span></button>
    <button class="dv-nav-btn" data-tab="more"><span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></span><span>More</span></button>
  </nav>
</div>

<!-- ============================= THREAD SCREEN (overlays shell) ============================= -->
<div id="dvThreadScreen" class="dv-shell dv-hidden">
  <header class="dv-thread-header">
    <button id="dvBtnThreadBack" type="button" class="dv-header-btn" aria-label="Back">
      <span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></span>
    </button>
    <div class="dv-avatar" id="dvThreadAvatar" style="width:38px;height:38px;font-size:0.9rem;">?</div>
    <div class="dv-thread-title-wrap">
      <div class="dv-thread-title" id="dvThreadTitle">Chat</div>
      <div class="dv-thread-sub" id="dvThreadSub"></div>
    </div>
    <button id="dvBtnThreadKebab" type="button" class="dv-header-btn dv-hidden" aria-label="Options">
      <span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></span>
    </button>
  </header>
  <main id="dvThreadMessages" class="dv-messages"></main>
  <div id="dvThreadTyping" class="dv-typing dv-hidden"><span></span><span></span><span></span></div>
  <footer class="dv-composer">
    <textarea id="dvThreadInput" class="dv-composer-input" rows="1" placeholder="Type a message..."></textarea>
    <button id="dvThreadSend" type="button" class="dv-header-btn dv-composer-send" aria-label="Send">
      <span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg></span>
    </button>
  </footer>
</div>

<!-- ============================= LEFT SIDEBAR (informational) ============================= -->
<div id="dvLeftBackdrop" class="dv-sidebar-backdrop dv-hidden"></div>
<div id="dvLeftSidebar" class="dv-sidebar dv-sidebar-left dv-hidden">
  <div class="dv-sidebar-header"><div class="dv-sidebar-header-title">Information</div></div>
  <div class="dv-sidebar-body">
    <button class="dv-sidebar-item" data-page="about-app"><span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg></span>About this App</button>
    <button class="dv-sidebar-item" data-page="about-mog"><span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>About the Man of God</button>
    <button class="dv-sidebar-item" data-page="mission"><span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6 6 1-4.5 4.5L17 20l-5-3-5 3 1.5-6.5L4 9l6-1z"></path></svg></span>About Mission</button>
    <button class="dv-sidebar-item" data-page="terms"><span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg></span>Terms of Use &amp; Privacy Policy</button>
    <button class="dv-sidebar-item" data-page="proprietary"><span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>Proprietary Software Notice</button>
    <button class="dv-sidebar-item" id="dvBtnExitLeftSidebar"><span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></span>Exit Sidebar</button>
  </div>
</div>

<!-- ============================= RIGHT SIDEBAR (utility settings) ============================= -->
<div id="dvRightBackdrop" class="dv-sidebar-backdrop dv-hidden"></div>
<div id="dvRightSidebar" class="dv-sidebar dv-sidebar-right dv-hidden">
  <div class="dv-sidebar-header"><div class="dv-sidebar-header-title">Settings</div></div>
  <div id="dvRightSidebarBody" class="dv-sidebar-body"></div>
</div>

<!-- ============================= FULL-PAGE CONTENT (About/Terms/Schedule/etc) ============================= -->
<div id="dvPageOverlay" class="dv-page-overlay dv-hidden">
  <div class="dv-page-header">
    <button id="dvBtnClosePage" type="button" class="dv-header-btn" aria-label="Close">
      <span class="dv-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></span>
    </button>
    <span id="dvPageTitle" class="dv-page-title">Info</span>
  </div>
  <div id="dvPageBody" class="dv-page-body"></div>
</div>

<div id="dvSpinnerOverlay" class="dv-spinner-overlay dv-hidden"><div class="dv-spinner"></div></div>
<div id="dvToastOverlay" class="dv-toast-overlay dv-hidden"><div id="dvToast" class="dv-toast"></div></div>

<script src="scripts.js"></script>
</body>
</html>
